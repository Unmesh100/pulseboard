<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulseboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="pulse-dot" aria-hidden="true"></span>
        <h1>Pulseboard</h1>
      </div>
      <p class="tagline">Live status for every service your on-call team owns.</p>
    </header>

    <main>
      <section id="overall" class="overall" aria-live="polite">Loading status…</section>

      <section class="summary" id="summary" aria-label="Status summary"></section>

      <form id="filters" class="filters" role="search" onsubmit="return false">
        <input id="q" type="search" placeholder="Search by service or team" aria-label="Search services" autocomplete="off" />
        <div id="status-chips" class="chips" role="group" aria-label="Filter by status"></div>
      </form>

      <section id="services" class="grid" aria-label="Services"></section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
